<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mad Scientist Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap">
<style>
/* Layout: progress track, a scene banner with Henry, his speech bubble, then one activity card at a time. */
:root{
  --night:#17343f; --night-2:#22495a; --card:#f7fbfb; --ink:#14262d; --muted:#4d6670;
  --sun:#ffc43d; --coral:#ff6a5a; --leaf:#34b987; --sky:#58b7f5; --grape:#8b6cf0;
  --line:#cfe2e6; --good:#1f9d6b; --bad:#d9483b;
  --display:"Lilita One","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:18px;
  color-scheme: light;
}
*{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;padding-inline:16px;padding-block:14px 48px}
.wrap,#app{max-width:760px;margin-inline:auto;display:flex;flex-direction:column;gap:14px;min-width:0}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:21px;color:var(--sun)}
.score{font-weight:700;color:#cfe9f0;font-variant-numeric:tabular-nums}
.track{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.track li{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:#9cc2cf}
.track .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);background:var(--night-2);color:#9cc2cf;border:2px solid #36637a}
.track li.now .dot{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.track li.done .dot{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.track .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

.scene{position:relative;height:150px;border-radius:var(--radius);overflow:hidden;border:3px solid var(--night-2);background:var(--night-2)}
.scene svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.henry{position:absolute;left:12px;bottom:-2px;width:84px;height:118px}
.henry svg{width:100%;height:100%;display:block}
.henry.cheer{animation:hop .45s ease 2}
@keyframes hop{50%{transform:translateY(-14px)}}
.place{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.92);border-radius:999px;padding:3px 12px;font-family:var(--display);font-size:15px;color:var(--ink)}
.bubble{position:relative;background:var(--card);border-radius:var(--radius);padding:12px 16px;font-size:16px;margin-top:-2px}
.bubble::before{content:"";position:absolute;left:38px;top:-10px;border:10px solid transparent;border-top:0;border-bottom-color:var(--card)}

.card{background:var(--card);border-radius:var(--radius);padding:18px 16px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font-size:27px;line-height:1.15}
.kicker{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead{margin:0;color:var(--muted)}
.host{display:flex;flex-direction:column;gap:12px;min-width:0}

.btn{border:0;border-radius:14px;padding:12px 20px;font-family:var(--display);font-size:19px;background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #c99200}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #c99200}
.btn.alt{background:#e3eff2;box-shadow:0 4px 0 #b6cdd3}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;color:var(--ink);min-height:48px}
.opt:hover:not(:disabled){border-color:var(--sky)}
.opt.right{background:#dff5ec;border-color:var(--good)}
.opt.wrong{background:#fde6e3;border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{border-radius:14px;padding:10px 14px;font-size:16px}
.fb.good{background:#dff5ec;color:#0d5a3d}
.fb.bad{background:#fde6e3;color:#7d1f16}
.fb.info{background:#e6f1f8;color:#173b52}
.prog{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.result{border-top:2px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.result strong{font-family:var(--display);font-weight:400;font-size:22px}

.stops{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;list-style:none;margin:0;padding:0}
.stops li{background:#e6f1f8;border-radius:12px;padding:8px 10px;font-size:14px;color:var(--muted)}
.stops b{display:block;font-family:var(--display);font-weight:400;font-size:16px;color:var(--ink)}
.starsbig{display:flex;gap:6px;font-size:44px;line-height:1;color:#cfdde1}
.starsbig .on{color:var(--sun);text-shadow:0 2px 0 #c99200}
.cert{border:4px double var(--sun);border-radius:16px;padding:20px 14px;text-align:center;background:#fffdf4;display:flex;flex-direction:column;gap:8px}
.cert-top{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cert-name{font-family:var(--display);font-size:34px;line-height:1.1;overflow-wrap:anywhere}
.cert-line{color:var(--muted)}
.field{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;width:100%;background:#fff;color:var(--ink)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Lab-specific widgets */
.rankbar{display:flex;align-items:center;gap:10px;color:#cfe9f0;font-size:13px;font-weight:700;min-width:0}
.rankbar .rk{white-space:nowrap}
.rankbar .meter{flex:1;min-width:60px;height:8px;border-radius:999px;background:var(--night-2);overflow:hidden}
.rankbar .meter i{display:block;height:100%;background:var(--sun);width:0;transition:width .5s}
.rankbar .pts{font-variant-numeric:tabular-nums;white-space:nowrap}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{flex:1;min-width:0;border:0;border-radius:12px;padding:10px 6px;font-family:var(--display);font-size:16px;background:var(--night-2);color:#cfe9f0}
.tab[aria-selected="true"]{background:var(--sun);color:var(--ink)}

.beakerbox{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.beaker{position:relative;width:150px;height:176px;border:4px solid var(--bd,#5b8493);border-top-width:2px;border-radius:6px 6px 32px 32px;overflow:hidden;background:var(--bg,#f2f9fb);flex:none;transition:box-shadow .4s}
.beaker .liq,.beaker .topl,.beaker .ppt,.beaker .foam{position:absolute;left:0;right:0;transition:height .6s,background .8s}
.beaker .liq{bottom:0;height:0;background:transparent}
.beaker .topl{bottom:58%;height:0}
.beaker .ppt{bottom:0;height:0;border-radius:50% 50% 0 0/30% 30% 0 0}
.beaker .foam{bottom:50%;height:0;background:#fff;border-radius:40% 40% 0 0/30% 30% 0 0;box-shadow:inset 0 -6px 0 rgba(0,0,0,.05)}
.beaker.hasfoam .foam{height:34%}
.beaker .bub{position:absolute;bottom:4px;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.9);border:1px solid #9bc3d1;opacity:0}
.beaker.b1 .bub{animation:rise 2.4s linear infinite}
.beaker.b2 .bub{animation:rise 1.5s linear infinite}
.beaker.b3 .bub{animation:rise .9s linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-150px);opacity:0}}
.beaker .fogl{position:absolute;left:0;right:0;top:0;height:60%;background:radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.95),rgba(255,255,255,0) 70%);opacity:0;transition:opacity .5s}
.beaker.fogon .fogl{opacity:1;animation:drift 3s ease-in-out infinite}
@keyframes drift{50%{transform:translateY(-8px)}}
.beaker.glow{box-shadow:0 0 30px 8px var(--glow,#ffc43d)}
.beaker .mark{position:absolute;inset:auto 6px 6px auto;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(20,38,45,.45)}

.side{flex:1;min-width:190px;display:flex;flex-direction:column;gap:10px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{border:2px dashed var(--line);border-radius:12px;padding:8px 10px;min-height:58px;background:#fff;display:flex;flex-direction:column;gap:2px;min-width:0}
.slot.on{border-style:solid;border-color:var(--sky)}
.slot .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.slot .nm{font-weight:700;overflow-wrap:anywhere;line-height:1.2}
.slot .fm{font-size:13px;color:var(--muted)}

.chip2{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;background:var(--kc,#cfe2e6);color:var(--ink)}
.res{display:flex;flex-direction:column;gap:10px;border-radius:14px;background:#f1f7f8;padding:14px}
.res h3{font-size:24px}
.res p{margin:0}
.warn{background:#fde6e3;color:#7d1f16;border-radius:12px;padding:10px 12px;font-weight:700;font-size:15px}
.newd{background:#fff4cc;color:#5a4400;border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px}
.chips2{display:flex;flex-wrap:wrap;gap:6px}

.sub{border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;display:flex;flex-direction:column;gap:8px}
.subhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);flex:none}
.subhead .n{font-family:var(--display);font-size:22px;line-height:1.1}
.subhead .f{color:var(--muted);font-size:15px}
.tag{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:#e6f1f8;color:#173b52;border-radius:999px;padding:2px 10px}
.sub p{margin:0}

.filters{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;color:var(--ink);min-height:36px}
.fchip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.t2{position:relative;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 8px 8px 10px;color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;min-height:62px}
.t2 .tn{font-weight:700;font-size:14px;line-height:1.15;overflow-wrap:anywhere}
.t2 .tf{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.t2 .dot{width:12px;height:12px;border-width:1.5px;position:absolute;top:8px;right:8px}
.t2.studied::after{content:"\2713";position:absolute;right:8px;bottom:5px;font-size:13px;font-weight:700;color:var(--good)}
.t2.selA{border-color:var(--sun);background:#fff6d6}
.t2.selB{border-color:var(--sky);background:#e6f4fd}
.t2 .badge{position:absolute;left:-6px;top:-8px;background:var(--ink);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
.emptynote{color:var(--muted);padding:10px 2px}

.study details{border:2px solid var(--line);border-radius:12px;background:#fff;padding:0}
.study summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:46px}
.study summary::-webkit-details-marker{display:none}
.study summary .n{font-weight:700}
.study summary .f{color:var(--muted);font-size:14px}
.study summary .ck{margin-left:auto;color:var(--good);font-weight:700}
.study .body{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.study .body p{margin:0}
.study{display:flex;flex-direction:column;gap:8px}

.qbox{display:flex;flex-direction:column;gap:10px}
.qbox h3{font-size:22px;line-height:1.2}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:#e6f1f8;border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kb{border-radius:12px;padding:8px 10px;background:#eef3f4;color:var(--muted);font-size:14px;min-height:64px}
.kb.on{background:var(--kc);color:var(--ink)}
.kb b{display:block;font-size:15px}
.hist{display:grid;gap:6px;list-style:none;margin:0;padding:0;font-size:15px}
.hist li{background:#f1f7f8;border-radius:10px;padding:6px 10px}
.small{font-size:14px;color:var(--muted)}
@media (max-width:420px){.beaker{width:132px;height:160px}}

/* Stage and effects */
.stage{--bh:176px;position:relative;padding-top:84px;flex:none;border-radius:14px;transition:background .5s}
.stage.dark{background:radial-gradient(ellipse at 50% 70%,#2b3350,#0e1226 75%)}
.stage .beaker{z-index:2}
.flame{position:absolute;left:50%;bottom:calc(var(--bh) - 18px);width:40px;height:70px;margin-left:-20px;z-index:1;border-radius:50% 50% 45% 45%/70% 70% 30% 30%;background:radial-gradient(ellipse at 50% 75%,#fff 0,var(--fc,#ffb02e) 35%,transparent 72%);filter:blur(1px);opacity:0;transform-origin:50% 100%;pointer-events:none}
.stage.flaming .flame{opacity:1;animation:flick .18s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1) skewX(-4deg)}to{transform:scale(.88,1.12) skewX(4deg)}}
.stage.flaming.dark .beaker{box-shadow:0 0 34px 10px var(--fc,#ffb02e)}
.stage.sparking .flame{box-shadow:0 0 14px 6px #ff8a2c}
.fx{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:visible}
.fx i{position:absolute;left:50%;top:calc(100% - var(--bh) / 2);width:9px;height:9px;margin:-4px;border-radius:50%;background:var(--pc,#ffb02e);box-shadow:0 0 8px var(--pc,#ffb02e);opacity:0}
.stage.boom .fx i{animation:fly .9s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.flash{position:absolute;inset:0;border-radius:14px;background:radial-gradient(circle at 50% 65%,#fff,rgba(255,255,255,0) 65%);opacity:0}
.stage.boom .flash{animation:flashy .5s ease-out}
@keyframes flashy{0%{opacity:.95}100%{opacity:0}}
.stage.quake{animation:quake .5s linear 2}
@keyframes quake{0%,100%{transform:translate(0)}20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,2px)}}
.word{position:absolute;left:50%;top:6px;transform:translateX(-50%) rotate(-6deg);font-family:var(--display);font-size:30px;color:#ffd23a;-webkit-text-stroke:2px #7a1d0e;paint-order:stroke fill;white-space:nowrap;text-shadow:0 3px 0 #7a1d0e}
.stage.boom .word{animation:pop .5s ease-out}
@keyframes pop{0%{transform:translateX(-50%) rotate(-6deg) scale(.3)}60%{transform:translateX(-50%) rotate(-6deg) scale(1.25)}100%{transform:translateX(-50%) rotate(-6deg) scale(1)}}
.erupt{position:absolute;left:50%;bottom:calc(var(--bh) - 14px);width:56px;height:0;margin-left:-28px;z-index:1;border-radius:40% 40% 20% 20%;background:var(--ec,#fff);opacity:0;pointer-events:none;box-shadow:-14px 6px 0 -4px var(--ec,#fff),14px 10px 0 -4px var(--ec,#fff)}
.stage.erupting .erupt{animation:erupt 2.4s ease-out forwards}
@keyframes erupt{0%{height:0;opacity:1}25%{height:82px;opacity:1}70%{height:64px;opacity:1}100%{height:30px;opacity:0}}
.beaker.lum .liq{animation:lum 1.6s ease-in-out infinite;box-shadow:0 0 22px 6px var(--lum,#b6ff4a)}
.beaker.lum{box-shadow:0 0 36px 12px var(--lum,#b6ff4a)}
@keyframes lum{50%{filter:brightness(1.35)}}
.cstrip{display:flex;align-items:center;gap:10px}
.cstrip span{width:56px;height:28px;border-radius:8px;border:2px solid var(--ink)}
.cstrip b{font-size:22px}
@media (max-width:420px){.stage{--bh:160px}}
@media (prefers-reduced-motion:reduce){.stage.quake,.stage.boom .word,.beaker.lum .liq{animation:none}}

/* Burner (heat) and black light lamp */
.stage{--pb:36px;padding:84px 14px var(--pb)}
.flame{bottom:calc(var(--bh) + var(--pb) - 18px)}
.erupt{bottom:calc(var(--bh) + var(--pb) - 14px)}
.fx i{top:calc(100% - var(--pb) - var(--bh) / 2)}
.burner{position:absolute;left:50%;bottom:0;width:60px;height:var(--pb);margin-left:-30px;z-index:1;pointer-events:none}
.bbody{position:absolute;left:14px;right:14px;bottom:0;height:12px;border-radius:4px 4px 2px 2px;background:linear-gradient(#8a9aa2,#5d6b73);box-shadow:0 2px 0 #3c474d}
.bflame{position:absolute;left:50%;bottom:10px;width:26px;height:30px;margin-left:-13px;border-radius:50% 50% 45% 45%/75% 75% 25% 25%;background:radial-gradient(ellipse at 50% 80%,#fff 0,#8fd0ff 28%,#ff9a2e 62%,rgba(255,154,46,0) 78%);opacity:0;transform-origin:50% 100%}
.stage.heating .bflame{opacity:1;animation:flick .16s ease-in-out infinite alternate}
.stage.heating .beaker{box-shadow:0 0 24px 6px rgba(255,120,40,.5)}
.stage.heating.dark .bflame{filter:drop-shadow(0 0 8px #ffb02e)}
.lamp{position:absolute;left:50%;top:10px;width:96px;height:14px;margin-left:-48px;border-radius:8px;background:#5a3fd0;box-shadow:0 0 0 2px #2a1a6a;opacity:0;transition:opacity .3s;z-index:3;pointer-events:none}
.lamp::after{content:"";position:absolute;left:-12px;right:-12px;top:14px;height:calc(var(--bh) + 56px);background:linear-gradient(rgba(143,107,255,.45),rgba(143,107,255,0));clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
.stage.uvl{background:radial-gradient(ellipse at 50% 30%,#3a2390,#0d0824 80%)}
.stage.uvl .lamp{opacity:1}
.beaker.lum .ppt{box-shadow:0 0 18px 4px var(--lum,#b6ff4a);animation:lum 1.6s ease-in-out infinite}
.btn.warm{background:#ff9a5c;box-shadow:0 4px 0 #c4622a}
.btn.uvb{background:#a58bff;box-shadow:0 4px 0 #6c52c9;color:#12082e}
.btn.warm:active:not(:disabled){box-shadow:0 1px 0 #c4622a}
.btn.uvb:active:not(:disabled){box-shadow:0 1px 0 #6c52c9}
@media (prefers-reduced-motion:reduce){.stage.heating .bflame{animation:none}}

/* Home Lab */
.tab{padding:10px 2px;font-size:15px}
@media (max-width:420px){.tab{font-size:13px}}
.homenote{background:#fff4cc;color:#4a3800;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.btn.tiny{font-size:14px;padding:6px 12px;box-shadow:0 3px 0 #b6cdd3}
.exps summary .f{font-size:13px}
.exph{background:#e6f1f8;border-radius:12px;padding:10px 12px}
.words{margin:0;display:grid;gap:6px}
.words div{background:#f1f7f8;border-radius:10px;padding:6px 10px}
.words dt{font-weight:700}
.words dd{margin:0}
.steps{margin:0;padding-left:0;list-style:none;counter-reset:s;display:grid;gap:8px}
.steps li{counter-increment:s;position:relative;padding:8px 10px 8px 44px;background:#fff;border:2px solid var(--line);border-radius:12px;min-height:44px}
.steps li::before{content:counter(s);position:absolute;left:8px;top:8px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--display);display:flex;align-items:center;justify-content:center;font-size:15px}
.adult{display:inline-block;background:#ff9a5c;color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.06em;border-radius:999px;padding:1px 8px;margin-right:6px}
.whybox{background:#e3f6ea;border-radius:12px;padding:10px 12px}
.twist{background:#efe9ff;border-radius:12px;padding:10px 12px}
.exps .filters .tag{text-transform:none;letter-spacing:0;font-size:14px;padding:3px 10px}

/* ---- solids, liquids, gases ---- */
.beaker .liq2{position:absolute;left:0;right:0;bottom:29%;height:0;transition:height .6s,background .8s}
.beaker .solids{position:absolute;inset:0;z-index:1;pointer-events:none}
.p{position:absolute;width:var(--w);height:var(--h);border-radius:var(--r);transform:rotate(var(--rot,0deg));box-shadow:inset -2px -2px 0 rgba(0,0,0,.2),0 0 0 1px rgba(0,0,0,.22);transition:background-color 1s}

function uniPick(ph) { return UNI.find(u => ph <= u[0]); }

function indicatorRule(x, y) {

const STRIPC = ['#e3262e', '#ee3d34', '#f26a30', '#f7922a', '#f9b92b', '#f6dc2e', '#c8de35', '#7fcb4c', '#3fb47a', '#2aa79a', '#2d8fc9', '#3b6bc6', '#4a4fb5', '#5a3a9c', '#6b2b86'];

function mixPH(m) {
  const { a, b, res } = m, subs = [a, b];
  if (res.k === 'danger') return { none: 'This one is not safe to test. Real chemists never dip anything into a dangerous mix.' };
  if (subs.some(z => z.T.has('radio'))) return { none: 'Radioactive elements are only for experts, and a paper strip would tell us nothing here.' };
  const hasWaterLiquid = subs.some(z => z.s === 'liquid' && (z.T.has('aq') || z.id === 'water'));
  const wet = !!m.wet || hasWaterLiquid || subs.some(z => z.id === 'ice');
  if (!wet) {
    if (subs.some(z => z.s === 'liquid')) return { none: 'That liquid is not water-based, so a pH strip cannot read it. pH only describes things dissolved in water.' };
    return { none: 'The strip needs a water-based liquid. Dry powders and gases do not give a reading. Try adding water first!' };
  }
  const alk = subs.find(z => z.T.has('alkali'));
  if (alk && res.k !== 'none' && !subs.some(z => z.T.has('acid'))) return { ph: 13, why: alk.n + ' reacts with water to make a strong base (its hydroxide), so the strip turns deep blue-purple.' };
  if (subs.some(z => z.id === 'quick') && !subs.some(z => z.T.has('acid'))) return { ph: 12, why: 'Quicklime and water make limewater, a strong base.' };
  if (subs.some(z => z.id === 'dry' || z.id === 'co2') && !subs.some(z => z.T.has('base'))) return { ph: 5, why: 'Carbon dioxide dissolves in water and makes a little carbonic acid.' };

  if (con.some(z => z.ph !== 7)) con = con.filter(z => z.ph !== 7);
  if (!con.length) return { ph: 7, why: 'Nothing here is a strong acid or base, so the reading stays close to neutral. This is an estimate.' };

      if (P.done[e.id]) { say('You already did this one. Try the Level up idea!', 'happy'); return; }
      P.done[e.id] = 1; const up = addPts(3); saveP(); ck.textContent = '✓'; upd();
      doneBtn.textContent = 'Done! +3 points';
      say((up ? 'Rank up: ' + up + '! ' : '') + 'Great work, scientist! Write down what you observed in your notebook.', 'cheer');
    } }, P.done[e.id] ? 'Done!' : 'I did this one! (+3 points)');
    const det = h('details', { id: 'exp-' + e.id },
      h('summary', {}, h('span', { class: 'n' }, e.title), h('span', { class: 'f' }, e.tag + ' | ' + e.time), ck),
      h('div', { class: 'body' },
        h('div', { class: 'exph' }, h('b', {}, 'Scientist question: '), e.ask),
        h('div', { class: 'label' }, 'Scientist words'),
        h('dl', { class: 'words' }, e.words.map(w => h('div', {}, h('dt', {}, w[0]), h('dd', {}, w[1])))),
        h('div', { class: 'label' }, 'What you need'),
        h('div', { class: 'filters' }, e.mats.map(m => h('span', { class: 'tag' }, m))),
        h('div', { class: 'label' }, 'Steps'),
        h('ol', { class: 'steps' }, e.steps.map(st => {
          const ad = st.startsWith('Adult: ');
          return h('li', {}, ad ? h('span', { class: 'adult' }, 'ADULT') : null, ad ? st.slice(7) : st);
        })),
        h('div', { class: 'whybox' }, h('b', {}, 'What is happening? '), e.why),
        h('div', { class: 'twist' }, h('b', {}, 'Level up: '), e.twist),
        h('div', { class: 'row' }, doneBtn),
        h('div', { class: 'small' }, 'Shelf items used: ' + e.uses.map(u => BY[u].n).join(', ') + '.')));
    det.addEventListener('toggle', () => { if (det.open) say(e.title + '! ' + e.ask, 'think'); });
    list.append(det);
  });
  p.append(h('div', { class: 'kicker' }, 'Kitchen science'), h('h2', {}, 'Home Lab'),
    h('p', { class: 'lead' }, 'Real experiments you can do at home with an adult, using things from your kitchen. Think like a scientist: ask a question, make a hypothesis, test it, observe, and record what happens.'),
    h('div', { class: 'warn' }, 'Safety first: always have an adult with you. Wear goggles for fizzy or foamy experiments, tie back long hair, and never taste anything unless the steps say it is food.'),
    count, list);
  upd();
  say('Welcome to the Home Lab! These experiments use real kitchen stuff. An adult must help with every one.', 'cheer');
  if (ST.openExp) {
    const d = $('#exp-' + ST.openExp);
    ST.openExp = null;
    if (d) { d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  }
}
/* ---------- Study tab ---------- */
function renderStudy() {
  const p = ui.panel;
  const count = h('div', { class: 'small' });
  const list = h('div', { class: 'study' });
  const updateCount = () => { count.textContent = 'Studied ' + Object.keys(P.studied).length + ' of ' + SUBS.length + ' substances. Open a card to read about it and test yourself.'; };
  function draw() {
    list.textContent = '';
    updateCount();
    const items = SUBS.filter(matches);
    if (!items.length) { list.append(h('div', { class: 'emptynote' }, 'No substance matches that search.')); return; }
    items.forEach(s => {
      const qh = h('div', { class: 'host' });
      const ck = h('span', { class: 'ck' }, P.studied[s.id] ? '✓' : '');
      const det = h('details', {},
        h('summary', {}, h('span', { class: 'dot', style: 'background:' + s.col }), h('span', { class: 'n' }, s.n), h('span', { class: 'f' }, s.f), ck),
        h('div', { class: 'body' },
          h('div', { class: 'row' }, h('span', { class: 'tag' }, CATS[s.c]), h('span', { class: 'tag' }, s.s)),
          h('p', {}, s.info),
          homeNote(s),
          h('div', { class: 'row' }, h('button', { class: 'btn alt', onclick: () => askQ(qh, s, null) }, 'Test myself')),
          qh));
      det.addEventListener('toggle', () => {
        if (!det.open) return;
        let up = null;
        if (!P.studied[s.id]) { P.studied[s.id] = 1; up = addPts(1); ck.textContent = '✓'; updateCount(); }
        say((up ? 'Rank up: ' + up + '! ' : '') + s.n + ': ' + firstSentence(s.info), 'think');
      });
      list.append(det);
    });
  }
  p.append(h('div', { class: 'kicker' }, 'Fact files'), h('h2', {}, 'Study the substances'), count,
    searchBox('q-study', draw), filterBar(draw), list);
  draw();
}

/* ---------- Quiz tab ---------- */
const QZ = { pool: 'studied', cat: 'all' };
function quizPool() { return SUBS.filter(s => (QZ.cat === 'all' || s.c === QZ.cat) && (QZ.pool === 'all' || P.studied[s.id])); }
function renderQuiz() {
  if (ST.quiz && ST.quiz.running) drawQuizQ(); else if (QZ.mode === 'bal') renderBalance(); else if (QZ.mode === 'mol') renderBuild(); else drawSetup();
}
function drawSetup() {
  const p = ui.panel; p.textContent = '';
  const note = h('div', { class: 'fb info' });
  const startBtn = h('button', { class: 'btn', onclick: startQuiz }, 'Start the quiz');
  const nStudied = Object.keys(P.studied).length;
  const upd = () => {
    const n = quizPool().length;
    startBtn.disabled = n < 4;
    note.textContent = n < 4
      ? 'Only ' + n + ' substance' + (n === 1 ? '' : 's') + ' in this set. Study at least 4 first, or choose Everything.'
      : 'This round has ' + Math.min(8, n) + ' questions from ' + n + ' substances. A first correct answer on each substance earns 3 points.';
  };
  const poolRow = h('div', { class: 'filters' }, [['studied', 'Ones I studied (' + nStudied + ')'], ['all', 'Everything (' + SUBS.length + ')']].map(([k, l]) =>
    h('button', {
      class: 'fchip', 'aria-pressed': String(QZ.pool === k),
      onclick: e => { QZ.pool = k; poolRow.querySelectorAll('.fchip').forEach(b => b.setAttribute('aria-pressed', 'false')); e.currentTarget.setAttribute('aria-pressed', 'true'); upd(); }
    }, l)));
  const catRow = h('div', { class: 'filters' }, [['all', 'All kinds']].concat(Object.keys(CATS).map(k => [k, CATS[k]])).map(([k, l]) =>
    h('button', {
      class: 'fchip', 'aria-pressed': String(QZ.cat === k),
      onclick: e => { QZ.cat = k; catRow.querySelectorAll('.fchip').forEach(b => b.setAttribute('aria-pressed', 'false')); e.currentTarget.setAttribute('aria-pressed', 'true'); upd(); }
    }, l)));
  p.append(quizModes(), h('div', { class: 'kicker' }, 'Trivia time'), h('h2', {}, 'Quiz round'),
    h('p', { class: 'lead' }, 'Questions come from the fact files. Study a few substances first, or quiz yourself on everything.'),
    h('div', { class: 'label' }, 'Question set'), poolRow, h('div', { class: 'label' }, 'Kind of substance'), catRow, note,
    h('div', { class: 'row' }, startBtn, h('button', { class: 'btn alt', onclick: () => setTab('study') }, 'Go study')));
  upd();
  say('Quiz time! Questions come from the fact files, so a little studying helps.', 'happy');
}
function startQuiz() {
  const pool = shuffle(quizPool()).slice(0, 8);
  ST.quiz = { items: pool, i: 0, right: 0, missed: [], running: true };
  drawQuizQ();
}
function drawQuizQ() {
  const q = ST.quiz, p = ui.panel; p.textContent = '';
  const s = q.items[q.i];
  const host = h('div', { class: 'host' });
  p.append(h('div', { class: 'kicker' }, 'Question ' + (q.i + 1) + ' of ' + q.items.length), host);
  askQ(host, s, (ok, fb) => {
    if (ok) q.right++; else q.missed.push(s);
    const last = q.i === q.items.length - 1;
    fb.after(h('button', { class: 'btn', onclick: () => { if (last) { q.running = false; drawQuizEnd(); } else { q.i++; drawQuizQ(); } } }, last ? 'See my score' : 'Next question'));
  });
}
function drawQuizEnd() {
  const q = ST.quiz, p = ui.panel; p.textContent = '';
  const pct = q.right / q.items.length;
  say(pct >= 0.8 ? 'Excellent! You really know your chemistry.' : pct >= 0.5 ? 'Nice work! A bit more studying and you will ace it.' : 'Good effort! Read the fact files and try again.', pct >= 0.8 ? 'cheer' : 'happy');
  p.append(h('div', { class: 'kicker' }, 'Round complete'), h('h2', {}, q.right + ' of ' + q.items.length + ' right'),
    q.missed.length ? h('div', { class: 'fb info' }, 'Review these: ' + q.missed.map(s => s.n).join(', ') + '.') : h('div', { class: 'fb good' }, 'A perfect round!'),
    h('div', { class: 'row' }, h('button', { class: 'btn', onclick: startQuiz }, 'Another round'), h('button', { class: 'btn alt', onclick: () => { ST.quiz = null; drawSetup(); } }, 'Change the set'), h('button', { class: 'btn alt', onclick: () => setTab('study') }, 'Study')));
}

/* ---------- Notebook tab ---------- */
function renderBook() {
  const p = ui.panel, r = rankInfo();
  const stat = (n, l) => h('div', { class: 'stat' }, h('b', {}, n), h('span', {}, l));
  const kinds = Object.keys(KINDS);
  const found = kinds.filter(k => P.kinds[k]).length;
  const histEl = P.hist.length
    ? h('ul', { class: 'hist' }, P.hist.map(x => h('li', {}, BY[x.a].n + ' + ' + BY[x.b].n + ': ' + x.t)))
    : h('div', { class: 'emptynote' }, 'No mixes yet. Head to the Mix tab!');
  const conf = h('div', { class: 'row', hidden: true },
    h('span', { class: 'small' }, 'Erase all progress?'),
    h('button', { class: 'btn', onclick: () => { P = { studied: {}, tested: {}, kinds: {}, qok: {}, hist: [], pts: 0, qn: 0, done: {}, ach: {}, cnt: {}, bal: {}, mol: {}, set: P.set || {} }; saveP(); ST.last = null; ST.A = ST.B = null; ST.quiz = null; renderRank(); setTab('book'); say('Fresh notebook! Let us start again.', 'happy'); } }, 'Yes, erase'),
    h('button', { class: 'btn alt', onclick: () => { conf.hidden = true; resetBtn.hidden = false; } }, 'Keep it'));
  const resetBtn = h('button', { class: 'btn alt', onclick: () => { conf.hidden = false; resetBtn.hidden = true; } }, 'Reset progress');
  p.append(h('div', { class: 'kicker' }, 'Lab notebook'), h('h2', {}, r.name),
    h('p', { class: 'lead' }, r.next ? (r.next[0] - P.pts) + ' more points to become a ' + r.next[1] + '.' : 'You reached the top rank. Keep exploring!'),
    h('div', { class: 'stats' },
      stat(Object.keys(P.studied).length + '/' + SUBS.length, 'substances studied'),
      stat(Object.keys(P.tested).length, 'different experiments tried'),
      stat(found + '/' + kinds.length, 'reaction types found'),
      stat(Object.keys(P.qok).length + '/' + SUBS.length, 'quiz answers mastered'),
      stat(Object.keys(P.done).length + '/' + HOME.length, 'home experiments done')),
    achGrid(),
    h('div', { class: 'label' }, 'Discoveries'),
    h('div', { class: 'kgrid' }, kinds.map(k => h('div', { class: 'kb' + (P.kinds[k] ? ' on' : ''), style: '--kc:' + KC[k] }, h('b', {}, P.kinds[k] ? KINDS[k] : '???'), P.kinds[k] ? P.kinds[k] : 'Not found yet'))),
    h('div', { class: 'label' }, 'Recent mixes'), histEl,
    h('div', { class: 'row' }, resetBtn), conf);
  say('This is my notebook. Every new kind of reaction you find gets written down here.', 'happy');
}

/* ---------- Start ---------- */
loadP();
buildShell();
ui.scene.innerHTML = sceneSVG('chem');
ui.scene.append(ui.henry, ui.place);
ui.place.textContent = "Chemistry Lab";
renderRank();
setTab('mix');
say(P.pts > 0 ? 'Welcome back to the lab! Your notebook is right where you left it.' : 'Welcome to my chemistry lab! There are ' + SUBS.length + ' substances on the shelf. Some explode, some glow and some change color! Tap one to learn about it, then pick two and press Mix.', 'cheer');
</script></body></html>
